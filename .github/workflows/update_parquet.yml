name: Update Parquet Files

# Trigger quando vengono caricati nuovi CSV (o modificati/eliminati)
on:
  push:
    paths:
      - 'data/portfolios/*.csv'
      - 'data/portfolios_depositaria/*.csv'
    
  workflow_dispatch:  # Permette esecuzione manuale

jobs:
  update-parquet:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout del repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessario per git history completo
      
      # 2. NUOVO STEP: Controlla se i file CSV sono stati 'aggiunti'
      - name: Check for added CSV files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Controlla solo i file aggiunti ('added') nei percorsi specificati
          filters: |
            csv_added:
              - 'added': 
                - 'data/portfolios/*.csv'
                - 'data/portfolios_depositaria/*.csv'

      # 3. Setup Python (Esegui solo se 'csv_added' è true)
      - name: Setup Python
        if: steps.filter.outputs.csv_added == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 4. Installa dipendenze (Esegui solo se 'csv_added' è true)
      - name: Install dependencies
        if: steps.filter.outputs.csv_added == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy
      
      # 5. Esegui aggiornamento Parquet (Esegui solo se 'csv_added' è true)
      - name: Update Parquet files
        if: steps.filter.outputs.csv_added == 'true'
        run: |
          python scripts/update_parquet_auto.py
      
      # 6. Configura Git per commit (Esegui solo se 'csv_added' è true)
      - name: Configure Git
        if: steps.filter.outputs.csv_added == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
      
      # 7. Commit e Push dei Parquet aggiornati (Esegui solo se 'csv_added' è true)
      - name: Commit and push changes
        if: steps.filter.outputs.csv_added == 'true'
        run: |
          git add data/consolidated/*.parquet
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update: Parquet files aggiornati [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
# 8. Notifica risultato (Corretto)
      - name: Summary
        if: always() # Esegui sempre questo step
        run: |
          echo "## 📊 Aggiornamento Parquet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Logica corretta per il riepilogo:
          
          # 1. Controlla prima se il job è fallito
          if [[ "${{ job.status }}" == "failure" ]]; then
            echo "❌ Aggiornamento fallito durante l'esecuzione." >> $GITHUB_STEP_SUMMARY
          
          # 2. Se non è fallito, controlla se lo step 'filter' ha dato 'true'
          elif [[ "${{ steps.filter.outputs.csv_added }}" == "true" ]]; then
            echo "✅ File Parquet aggiornati con successo (rilevati nuovi file CSV)." >> $GITHUB_STEP_SUMMARY
          
          # 3. Se non è fallito e il filtro non era 'true', allora è stato saltato
          else
            echo "ℹ️ Nessun *nuovo* file CSV aggiunto nei percorsi monitorati. Aggiornamento saltato." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
